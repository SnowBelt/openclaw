        run: pnpm check:changed -- packages/gateway-protocol/src/schema/pcc.ts src/gateway/server-methods/pcc.ts src/gateway/server-methods/pcc.test.ts ui/src/ui/views/pcc.ts ui/src/ui/views/pcc-operational-confidence.ts ui/src/ui/views/pcc.test.ts ui/src/ui/controllers/pcc.ts ui/src/ui/pcc-context-package.ts ui/src/ui/pcc-context-package.test.ts ui/src/ui/app-render.ts ui/src/ui/app-settings.ts ui/src/ui/app-settings.refresh-active-tab.node.test.ts ui/src/ui/app.ts ui/src/ui/app-view-state.ts ui/src/styles/pcc.css ui/src/styles/components.css scripts/dev/control-ui-pcc-project-agnostic-smoke.ts scripts/dev/control-ui-pcc-audit-closure-v1-smoke.ts scripts/dev/control-ui-pcc-audit-findings-closure-v1-smoke.ts scripts/dev/control-ui-pcc-usability-completion-v3-smoke.ts scripts/dev/control-ui-pcc-skimmable-journey-smoke.ts scripts/dev/control-ui-pcc-new-project-intuition-smoke.ts scripts/dev/control-ui-pcc-apple-simple-ux-smoke.ts scripts/dev/control-ui-pcc-functionality-closure-v1-smoke.ts scripts/dev/control-ui-pcc-focus-live-interaction-closure-smoke.ts scripts/dev/control-ui-pcc-final-functionality-closure-smoke.ts scripts/dev/control-ui-pcc-operational-confidence-smoke.ts scripts/dev/control-ui-pcc-execution-standard-smoke.ts scripts/dev/control-ui-pcc-live-disposable-browser-e2e.ts scripts/dev/control-ui-pcc-live-disposable-browser-e2e-isolated.ts scripts/dev/control-ui-pcc-production-runtime-auth-proof.ts src/pcc/execution-standard.ts src/pcc/execution-standard.test.ts src/pcc/execution-plan.ts src/pcc/execution-plan.test.ts src/pcc/learning-candidates.ts src/pcc/learning-candidates.test.ts src/pcc/learning-repair.ts src/pcc/learning-store.ts src/pcc/learning-store.test.ts src/pcc/metadata.ts src/pcc/autopilot.ts src/pcc/autopilot.test.ts src/pcc/ledger-store.ts src/pcc/ledger-store.test.ts src/pcc/project-action.ts src/pcc/project-action.test.ts src/pcc/production-truth.ts src/pcc/production-truth.test.ts src/pcc/runtime-identity.ts src/pcc/runtime-identity.tes